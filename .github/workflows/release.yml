name: Build and publish the container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install ".[test]"
      - name: Run pytest
        run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=${name}:${GITHUB_REF_NAME},${name}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${name}:edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Verify the published architectures
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          first="${TAGS%%,*}"
          docker buildx imagetools inspect --raw "$first" > "$RUNNER_TEMP/manifest.json"
          python -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); platforms = {(i.get("platform", {}).get("os"), i.get("platform", {}).get("architecture")) for i in data["manifests"]}; required = {("linux", "amd64"), ("linux", "arm64")}; assert required <= platforms, f"Missing architectures: {sorted(required - platforms)}"; print("Published platforms verified:", sorted(required))' "$RUNNER_TEMP/manifest.json"
